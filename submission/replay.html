<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTCG Replay</title>
<style>
  :root{
    --felt:#8bc677; --ink:#33384a; --muted:#46563c;
    --panel:#ffffff; --line:#a9be98; --line2:#bcd0ac;
    --you:#225a93; --opp:#b23f37;
    --w:#3d8fd0;--r:#e2603f;--g:#54b35e;--l:#dcbb2f;--p:#9b5fc0;--f:#c07d3a;
    --d:#5a5a78;--m:#7f8c98;--c:#b3b3c0;--n:#cf9b3a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--felt);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  .wrap{max-width:1500px;margin:0 auto;padding:10px 12px 90px}
  /* top bar */
  .topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .topbar h1{font-size:13px;margin:0;font-weight:700;letter-spacing:.04em;color:#2b3a22}
  .meta{font-size:12px;color:#3c4d31}
  .turn{margin-left:auto;display:flex;align-items:center;gap:8px}
  .turn .t{font-size:13px}.turn .t b{font-size:15px}
  .badge{font-size:12px;padding:2px 9px;border-radius:5px;border:1px solid var(--line);background:#fff;font-weight:600}
  .badge.you{color:var(--you)} .badge.opp{color:var(--opp)}
  .ask{font-size:12px;color:#3c4d31}
  /* columns: mat + log */
  .cols{display:grid;grid-template-columns:1fr 320px;gap:12px;align-items:start}
  @media(max-width:920px){.cols{grid-template-columns:1fr}}
  .mat{background:rgba(255,255,255,.12);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .side{padding:4px 2px}
  .phead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 0 6px}
  .pname{font-size:12px;font-weight:700;letter-spacing:.02em}
  .pname.you{color:var(--you)} .pname.opp{color:var(--opp)}
  .counts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .cnt{font-size:11px;color:#33402a;background:#fff;border:1px solid var(--line2);border-radius:5px;padding:2px 6px}
  .cnt b{font-weight:700}
  .prizes{display:flex;gap:2px;margin-right:2px}
  .pcard{width:9px;height:14px;border-radius:2px;background:#5b78a8;border:1px solid #3f5a86}
  .pcard.taken{background:transparent;border-style:dashed;border-color:#9fb78d}
  /* board rows */
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;min-height:10px}
  .row.active{margin:6px 0}
  .divider{display:flex;align-items:center;justify-content:center;margin:7px 0;
    border-top:1px dashed var(--line)}
  .divider span{transform:translateY(-50%);background:var(--felt);padding:0 10px;font-size:11px;color:#3c4d31}
  /* card tiles (image) */
  .imgcard{width:96px;border-radius:6px;overflow:hidden;position:relative;border:1px solid #4a5a3a;
    background:#dfe6d6;line-height:0}
  .imgcard.big{width:124px}
  .imgcard img{width:100%;display:block}
  .imgcard.ko{filter:grayscale(.7) brightness(.6)}
  .imgcard.hit{outline:2px solid #e23b3b;outline-offset:-2px}
  .imgcard .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;
    pointer-events:none;line-height:1.2}
  .imgcard .ovtop{padding:2px}
  .imgcard .ovbot{padding:2px 3px;background:rgba(20,24,16,.78)}
  .imgcard .hp{font-size:10px;color:#fff;font-weight:700;white-space:nowrap;display:flex;justify-content:space-between;gap:4px}
  .imgcard .dmg{color:#ff9a9a}
  .imgcard .chips{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:1px}
  .chip{width:11px;height:11px;border-radius:50%;font-size:7px;display:flex;align-items:center;
    justify-content:center;color:#0a0d08;font-weight:800}
  .status{display:inline-block;font-size:8px;font-weight:700;padding:0 3px;border-radius:3px;
    background:#d23b4e;color:#fff;margin:1px 1px 0 0}
  /* fallback styled tile (no images) */
  .card{width:112px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
  .card.bench{width:92px}
  .chead{display:flex;justify-content:space-between;gap:4px;padding:3px 5px;background:#eef3e8}
  .cname{font-size:11px;font-weight:700;line-height:1.15}
  .chp{font-size:10px;font-weight:700;white-space:nowrap}
  .cbody{padding:4px 5px}
  .hpbar{height:5px;background:#dde4d4;border-radius:3px;overflow:hidden;margin-bottom:4px}
  .hpfill{height:100%;background:#54b35e}.hpfill.mid{background:#e0b53a}.hpfill.low{background:#e25a44}
  .atk{display:flex;justify-content:space-between;gap:6px;font-size:10px;line-height:1.45;color:#3a4630}
  .atk .ad{font-weight:700}
  .atkcost{font-size:8px;color:#6a7860}
  .rule{display:inline-block;font-size:8px;color:#fff;background:#caa23a;padding:0 4px;border-radius:3px;margin-top:2px}
  .empty{width:96px;height:62px;border:1px dashed var(--line);border-radius:6px;display:flex;
    align-items:center;justify-content:center;color:#5e6e51;font-size:10px}
  .empty.big{width:124px;height:80px}
  /* hand row */
  .handrow{display:flex;align-items:center;gap:6px;margin:5px 0;padding:4px 0;
    border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
  .handlbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#46563c;min-width:38px}
  .hand{display:flex;gap:4px;flex-wrap:wrap}
  .handcard{width:54px;border-radius:4px;overflow:hidden;border:1px solid #4a5a3a;background:#dfe6d6;line-height:0}
  .handcard img{width:100%;display:block}
  .handchip{font-size:10px;background:#fff;border:1px solid var(--line2);border-radius:4px;
    padding:2px 6px;color:#33402a;line-height:1.3;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .handempty{font-size:11px;color:#5e6e51;font-style:italic}
  /* log panel */
  .logpanel{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .loghead{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#4a5a3a;
    padding:7px 10px;border-bottom:1px solid var(--line2);background:#f3f7ee}
  .log{font-size:12px;line-height:1.65;color:#3a4431;padding:8px 10px;max-height:560px;overflow:auto}
  .log .le{padding:1px 0}
  .log .le.cur{background:#eef6e6;border-radius:3px}
  .log .tn{color:#8a978016;color:#8a9780;font-size:10px}
  .log .you{color:var(--you);font-weight:700} .log .opp{color:var(--opp);font-weight:700}
  .log .nolog{color:#9aa790}
  /* result + dock */
  .result{margin:8px 0;padding:8px 12px;border-radius:6px;text-align:center;font-weight:700;border:1px solid var(--line);background:#fff}
  .result.win{color:var(--you)} .result.lose{color:var(--opp)}
  .dock{position:fixed;left:0;right:0;bottom:0;background:#f3f7ee;border-top:1px solid var(--line);padding:8px 12px}
  .dock .inner{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:9px}
  button{font:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);
    border-radius:6px;padding:6px 11px;cursor:pointer}
  button:hover{background:#eaf1e2} button:disabled{opacity:.45;cursor:default}
  input[type=range]{flex:1;accent-color:var(--you)}
  .step{font-size:12px;color:#3c4d31;min-width:96px;text-align:right}
</style>

</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>PTCG REPLAY</h1>
    <span class="meta mono" id="meta"></span>
    <span class="turn">
      <span class="t">Turn <b id="turn">0</b></span>
      <span class="badge" id="decider">—</span>
      <span class="ask" id="ask"></span>
    </span>
  </div>

  <div id="result"></div>

  <div class="cols">
    <div class="mat">
      <div class="side opp">
        <div class="phead"><span class="pname opp" id="p1name">Opponent</span><span class="counts" id="p1counts"></span></div>
        <div class="handrow"><span class="handlbl">Hand</span><div class="hand" id="p1hand"></div></div>
        <div class="row" id="p1bench"></div>
        <div class="row active" id="p1active"></div>
      </div>
      <div class="divider"><span id="stadium">No Stadium</span></div>
      <div class="side you">
        <div class="row active" id="p0active"></div>
        <div class="row" id="p0bench"></div>
        <div class="handrow"><span class="handlbl">Hand</span><div class="hand" id="p0hand"></div></div>
        <div class="phead"><span class="pname you" id="p0name">You</span><span class="counts" id="p0counts"></span></div>
      </div>
    </div>
    <div class="logpanel">
      <div class="loghead">Game Log</div>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<div class="dock">
  <div class="inner">
    <button id="first">&#9198;</button>
    <button id="prev">&#9664; Prev</button>
    <button id="play">&#9654; Play</button>
    <button id="next">Next &#9654;</button>
    <input type="range" id="scrub" min="0" value="0">
    <span class="step mono">Step <b id="cur">0</b> / <span id="total">0</span></span>
  </div>
</div>

// EnergyType int -> [letter,color]
const ETYPE = {0:['C','#d2d2dc'],1:['G','#5cc46a'],2:['R','#ff6b4a'],3:['W','#4aa3df'],
  4:['L','#f4d03f'],5:['P','#b06fd6'],6:['F','#d4894a'],7:['D','#7d7da0'],8:['M','#9aa7b0'],
  9:['N','#e0b24a'],10:['*','#d28fe0'],11:['TR','#c45c7a']};
// type letter -> header band color
const TBAND = {G:'#1f3a26',R:'#3a201c',W:'#1c2f3a',L:'#3a341c',P:'#311f3a',F:'#3a2a1c',
  D:'#262633',M:'#26303a',C:'#2c2c36',N:'#3a311c','':'#222a3d'};

const $ = id => document.getElementById(id);
function db(id){ return CARDDB[id] || CARDDB[String(id)] || null; }

function energyChips(pk){
  const arr = pk.energies||[]; if(!arr.length) return '<div class="chips"></div>';
  let h='<div class="chips">';
  for(const e of arr){ const m=ETYPE[e]||['?','#888']; h+=`<span class="chip" style="background:${m[1]}">${m[0]}</span>`; }
  return h+'</div>';
}
function statusTags(ps){
  const t=[]; if(ps.poisoned)t.push('PSN'); if(ps.burned)t.push('BRN');
  if(ps.asleep)t.push('SLP'); if(ps.paralyzed)t.push('PAR'); if(ps.confused)t.push('CNF');
  return t.map(x=>`<span class="status">${x}</span>`).join('');
}
function attacksHtml(d){
  if(!d || !d.atk || !d.atk.length) return '';
  return d.atk.slice(0,3).map(a=>{
    const cost=(a[1]||'').replace(/[{}]/g,'');
    const dmg=a[2]||'';
    return `<div class="atk"><span class="an">${a[0]}</span><span class="ad">${dmg}</span></div>
            ${cost?`<div class="atkcost">${cost}</div>`:''}`;
  }).join('');
}
function cardHtml(pk, ps, opt){
  opt=opt||{};
  const big=opt.big?' big':'';
  if(!pk) return `<div class="empty${opt.big?' big':''}">${opt.big?'no active':'—'}</div>`;
  const d=db(pk.id);
  const hp=pk.hp, mx=pk.maxHp||hp, pct=mx?Math.max(0,Math.min(100,100*hp/mx)):0;
  const cls=pct<=33?'low':(pct<=66?'mid':'');
  const ko=hp<=0?' ko':'';
  const hit=opt.hit?' hit':'';
  const img=CARDIMG[pk.id]||CARDIMG[String(pk.id)]||null;

  // Image mode: real card art + a flat info strip (HP / energy / status). Closest to official.
  if(img){
    const dmg=(mx-hp)>0?`<span class="dmg">-${mx-hp}</span>`:'';
    const tool=(pk.tools&&pk.tools.length)?` +T${pk.tools.length}`:'';
    return `<div class="imgcard${big}${ko}${hit}">
      <img src="${img}" alt="${pk.name||pk.id}" loading="lazy">
      <div class="ov">
        <div class="ovtop">${ps?statusTags(ps):''}</div>
        <div class="ovbot">
          ${energyChips(pk)}
          <div class="hp"><span>${hp}/${mx}${tool}</span>${dmg}</div>
        </div>
      </div>
    </div>`;
  }

  // Fallback: flat styled tile (when no images extracted).
  const ruleTag=(d&&d.rule)?`<span class="rule">${d.rule}</span>`:'';
  const atks=opt.big?attacksHtml(d):'';
  const tools=(pk.tools&&pk.tools.length)?`<div class="atkcost">Tool ×${pk.tools.length}</div>`:'';
  return `<div class="card${opt.big?'':' bench'}${ko}${hit}">
    <div class="chead">
      <span class="cname">${pk.name||('#'+pk.id)}</span>
      <span class="chp mono">${hp}/${mx}</span>
    </div>
    <div class="cbody">
      <div class="hpbar"><div class="hpfill ${cls}" style="width:${pct}%"></div></div>
      ${energyChips(pk)}
      ${atks}${tools}
      <div>${ps?statusTags(ps):''}${opt.big?ruleTag:''}</div>
    </div>
  </div>`;
}
function benchHtml(arr, hitSet){
  let cells='';
  const list=arr||[];
  for(let k=0;k<5;k++){
    const pk=list[k];
    cells+=cardHtml(pk||null,null,{bench:true, hit: pk&&hitSet.has(pk.serial)});
  }
  return cells;
}
function prizeStack(p, mineColor){
  const total=(p.prize||[]).length;
  // prize array holds remaining prize cards; render 6 slots, "taken" = missing
  let h='<div class="prizes">';
  for(let k=0;k<6;k++) h+=`<span class="pcard${k>=total?' taken':''}"></span>`;
  return h+'</div>';
}
function counts(p){
  return `<span class="cnt">Hand <b>${p.handCount}</b></span>
          <span class="cnt">Deck <b>${p.deckCount}</b></span>
          <span class="cnt">Discard <b>${(p.discard||[]).length}</b></span>
          <span class="cnt prize">Prize <b>${(p.prize||[]).length}</b></span>`;
}
function handHtml(p){
  const hand=p.hand||[];
  if(!hand.length) return '<span class="handempty">empty</span>';
  return hand.map(cd=>{
    const img=CARDIMG[cd.id]||CARDIMG[String(cd.id)]||null;
    if(img) return `<div class="handcard"><img src="${img}" alt="${cd.name||cd.id}" loading="lazy"></div>`;
    return `<span class="handchip">${cd.name||('#'+cd.id)}</span>`;
  }).join('');
}

const LOGNAMES={Draw:'draws',AttachEnergy:'attaches Energy',Attack:'attacks',Damage:'deals damage',
  KnockOut:'Knock Out',Evolve:'evolves',PlayToActive:'plays to Active',PlayToBench:'benches a Pokémon',
  TakePrize:'takes a Prize',Retreat:'retreats',UseAbility:'uses an Ability',Mulligan:'mulligan',
  CoinFlip:'coin flip',PlaySupporter:'plays Supporter',PlayItem:'plays Item',PlayStadium:'plays Stadium'};
function evLine(l){
  const t=l.type||'event';
  const pl=(l.playerIndex===0)?'<span class="you">You</span> ':(l.playerIndex===1)?'<span class="opp">Opp</span> ':'';
  const nm=LOGNAMES[t]||t;
  const extra=(l.value!=null)?` (${l.value})`:'';
  return `${pl}${nm}${extra}`;
}
// Build a running log: every snapshot's events, tagged with its step index + turn.
const LOGALL=[];
REPLAY.forEach((snap,si)=>{
  const turn=snap.current?snap.current.turn:'';
  (snap.logs||[]).forEach(l=>LOGALL.push({si,turn,html:evLine(l)}));
});
function renderLog(upto){
  const el=$('log');
  const rows=LOGALL.filter(e=>e.si<=upto);
  if(!rows.length){ el.innerHTML='<span class="nolog">— no events yet —</span>'; return; }
  el.innerHTML=rows.map(e=>
    `<div class="le${e.si===upto?' cur':''}"><span class="tn">T${e.turn}</span> ${e.html}</div>`).join('');
  el.scrollTop=el.scrollHeight;
}
function describeSelect(snap){
  const s=snap.select; if(!s) return '';
  const ty=s.type||''; const ctx=s.context||'';
  return ctx&&ctx!==ty ? `${ty} · ${ctx}` : ty;
}

// compute which serials lost HP vs previous shown snapshot (for hit flash)
function hitSerials(prev, cur){
  const set=new Set(); if(!prev||!cur) return set;
  const map={};
  for(const p of prev.players) for(const pk of [...(p.active||[]),...(p.bench||[])]) if(pk) map[pk.serial]=pk.hp;
  for(const p of cur.players) for(const pk of [...(p.active||[]),...(p.bench||[])]) if(pk){
    if(map[pk.serial]!=null && pk.hp<map[pk.serial]) set.add(pk.serial);
  }
  return set;
}

let i=0; const N=REPLAY.length;
$('total').textContent=N-1; $('scrub').max=N-1;
$('meta').textContent=`${LABELS.p0} vs ${LABELS.p1} · seed ${LABELS.seed} · ${N} snapshots`;
$('p0name').textContent='You — '+LABELS.p0;
$('p1name').textContent='Opp — '+LABELS.p1;

function render(){
  const snap=REPLAY[i], cur=snap.current;
  $('cur').textContent=i; $('scrub').value=i;
  if(!cur){ $('turn').textContent='—'; return; }
  $('turn').textContent=cur.turn;
  const who=cur.yourIndex, dec=$('decider');
  dec.textContent= who===0?'Your decision':'Opponent decision';
  dec.className='badge '+(who===0?'you':'opp');
  $('ask').textContent=describeSelect(snap)?('deciding: '+describeSelect(snap)):'';

  const prev = i>0?REPLAY[i-1].current:null;
  const hits = hitSerials(prev,cur);
  const P=cur.players;

  $('p0counts').innerHTML=prizeStack(P[0])+counts(P[0]);
  $('p1counts').innerHTML=prizeStack(P[1])+counts(P[1]);
  const a0=(P[0].active||[])[0], a1=(P[1].active||[])[0];
  $('p0active').innerHTML=cardHtml(a0,P[0],{big:true,hit:a0&&hits.has(a0.serial)});
  $('p1active').innerHTML=cardHtml(a1,P[1],{big:true,hit:a1&&hits.has(a1.serial)});
  $('p0bench').innerHTML=benchHtml(P[0].bench,hits);
  $('p1bench').innerHTML=benchHtml(P[1].bench,hits);
  $('p0hand').innerHTML=handHtml(P[0]);
  $('p1hand').innerHTML=handHtml(P[1]);

  const st=cur.stadium&&cur.stadium.length?cur.stadium[0]:null;
  $('stadium').textContent= st ? (st.name||('Stadium #'+st.id)) : 'No Stadium';

  renderLog(i);

  const r=$('result');
  if(cur.result!==-1 && i===N-1){
    const win=cur.result===0;
    r.className='result '+(win?'win':'lose');
    r.textContent= win?'You won this game.':'Opponent won this game.';
  } else { r.className=''; r.textContent=''; }
}
function go(n){ i=Math.max(0,Math.min(N-1,n)); render(); }
$('next').onclick=()=>go(i+1); $('prev').onclick=()=>go(i-1); $('first').onclick=()=>go(0);
$('scrub').oninput=e=>go(+e.target.value);
document.onkeydown=e=>{ if(e.key==='ArrowRight')go(i+1); if(e.key==='ArrowLeft')go(i-1); };
let timer=null;
$('play').onclick=function(){
  if(timer){clearInterval(timer);timer=null;this.textContent='▶ Play';return;}
  this.textContent='⏸ Pause';
  timer=setInterval(()=>{ if(i>=N-1){clearInterval(timer);timer=null;$('play').textContent='▶ Play';} else go(i+1); },850);
};
render();
</script>
